name: run-scripts

on:

  schedule:
      - cron: '30 5 * * *' # Every day at 05:30 UTC (00:30 EST)
  
  workflow_dispatch:

jobs:

  generate-files:
    name: Run Python script(s) to generate files
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      #---------------
      # Checkout repo
      #---------------
      - name: Checkout repository
        uses: actions/checkout@v6
      
      #--------------
      # Setup Python
      #--------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          
      #-------------------------
      # Check for cached Poetry
      #-------------------------
      - name: Load cached Poetry
        id: cached-poetry
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-interpreter

      #----------------------------
      # Install & configure Poetry
      #----------------------------
      - name: Install Poetry
        if: steps.cached-poetry.outputs.cache-hit != 'true'
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          virtualenvs-path: .venv
          installer-parallel: true

      #----------------------------------
      # Load cached venv if cache exists
      #----------------------------------
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      
      #----------------------------------------------
      # Install dependencies if cache does not exist
      #----------------------------------------------
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      #----------------------
      # Install root project
      #----------------------
      - name: Install project
        run: poetry install --no-interaction
      
      #------------
      # Run script
      #------------
      - name: Run scripts
        run: |
          poetry run python utils/datasets.py
      
      #-------------
      # Stage files
      #-------------
      - name: Stage files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -a -m "Update metadata" --allow-empty

      #--------------
      # Commit files
      #--------------
      - name: Commit files
        run: |
          git push -f
